databaseChangeLog:
    - changeSet:
          id: create-master-data-table
          author: ai-agent
          changes:
              - createTable:
                    tableName: source_lab_data
                    columns:
                        - column:
                              name: Unique_ID
                              type: VARCHAR(36)
                              constraints:
                                  primaryKey: true
                                  nullable: false
                        - column:
                              name: LongAccessionNumberUID
                              type: VARCHAR(50)
                        - column:
                              name: LabChemTestSID
                              type: BIGINT
                        - column:
                              name: LabChemTestName
                              type: VARCHAR(255)
                        - column:
                              name: LabChemTestUrgencySID
                              type: BIGINT
                        - column:
                              name: Urgency
                              type: VARCHAR(100)
                        - column:
                              name: LabChemResultValue
                              type: VARCHAR(255)
                        - column:
                              name: LabChemResultNumericValue
                              type: DECIMAL(10,4)
                        - column:
                              name: TopographySID
                              type: BIGINT
                        - column:
                              name: Topography
                              type: VARCHAR(100)
                        - column:
                              name: AccessionInstitutionSID
                              type: BIGINT
                        - column:
                              name: AccessioningInstitution
                              type: VARCHAR(255)
                        - column:
                              name: OrderingInstitutionSID
                              type: BIGINT
                        - column:
                              name: OrderingInstutionName
                              type: VARCHAR(255)
                        - column:
                              name: CollectingInstitutionSID
                              type: BIGINT
                        - column:
                              name: CollectingInstitutionName
                              type: VARCHAR(255)
                        - column:
                              name: LOINCSID
                              type: BIGINT
                        - column:
                              name: LOINC
                              type: VARCHAR(50)
                        - column:
                              name: Units
                              type: VARCHAR(50)
                        - column:
                              name: Abnormal
                              type: VARCHAR(10)
                        - column:
                              name: RefHigh
                              type: DECIMAL(10,4)
                        - column:
                              name: RefLow
                              type: DECIMAL(10,4)
                        - column:
                              name: Device_ID
                              type: DECIMAL(20,4)