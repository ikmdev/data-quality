# Database configurations (Single source of truth)
db.host=localhost
db.port=5432
db.name=dq
db.user=dq
db.password=dq_password

# Spring Boot internal Postgres pool (References the variables above)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${db.host}:${db.port}/${db.name}
spring.datasource.username=${db.user}
spring.datasource.password=${db.password}

# PIQI Server configuration
piqi.api.base-url=http://localhost/piqi
piqi.score-path=/PIQI/ScoreAuditMessage
piqi.timeout-ms=30000

# Logging Properties
logging.level.root=WARN
logging.level.dev.ikm.dq=DEBUG
logging.file.name=logs/cli.log
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n